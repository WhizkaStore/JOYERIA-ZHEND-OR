<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso — ZHEND’OR Joyería</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23F5EED9'/%3E%3Cpath d='M32 8 L50 32 L32 56 L14 32 Z' fill='none' stroke='%23D8BE69' stroke-width='3'/%3E%3Cpath d='M32 20 L42 32 L32 44 L22 32 Z' fill='%23E8D58B'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="login-body">
  <main class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <span class="login-name">ZHEND’OR</span>
        <span class="login-tagline">Joyería</span>
      </div>
      <p class="login-sub">Panel de administración</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Usuario o correo electrónico</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <p class="form-error" id="login-error" hidden></p>
        <button type="submit" class="btn btn-gold btn-block" id="login-submit">Entrar</button>
      </form>

      <a class="login-back" href="/">← Volver a la tienda</a>
    </div>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');
    const submit = document.getElementById('login-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) {
        errorEl.textContent = 'Introduce tu usuario y contraseña.';
        errorEl.hidden = false;
        return;
      }
      submit.disabled = true;
      submit.textContent = 'Comprobando…';
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          errorEl.textContent = data.error || 'No se pudo iniciar sesión.';
          errorEl.hidden = false;
          return;
        }
        location.replace('/admin');
      } catch {
        errorEl.textContent = 'Error de conexión con el servidor.';
        errorEl.hidden = false;
      } finally {
        submit.disabled = false;
        submit.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
